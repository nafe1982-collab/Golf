<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f43">
  <title>Golf Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>⛳ Golf Tracker</h1>
    <nav class="tabs" aria-label="Sections">
      <a href="#rounds" data-tab="rounds">Rounds</a>
      <a href="#new" data-tab="new">New round</a>
      <a href="#courses" data-tab="courses">Courses</a>
      <a href="#stats" data-tab="stats">Stats</a>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <span>Data is stored in this browser only.</span>
    <button type="button" class="link" id="export-btn">Export</button>
    <label class="link">Import<input type="file" id="import-input" accept="application/json" hidden></label>
  </footer>

  <script src="stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
